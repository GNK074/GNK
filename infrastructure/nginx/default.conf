log_format gnk_safe '$remote_addr $request_method $uri $status $request_time';
server { listen 80; server_name _; access_log /var/log/nginx/access.log gnk_safe; error_log /var/log/nginx/error.log crit; add_header Referrer-Policy no-referrer always; client_max_body_size 3m; location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; } location /docs { proxy_pass http://backend:8000; } location /openapi.json { proxy_pass http://backend:8000; } location / { proxy_pass http://frontend:80; } }
