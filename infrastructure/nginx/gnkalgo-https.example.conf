# Install alongside existing host configuration only after review. Do not replace
# working certificates or an existing Nginx configuration automatically.
server {
    listen 80;
    server_name gnkalgo.com api.gnkalgo.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name gnkalgo.com api.gnkalgo.com;
    ssl_certificate /etc/letsencrypt/live/gnkalgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnkalgo.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # No query strings, authorization headers or cookies in access logs.
    access_log off;
    error_log /var/log/nginx/gnk-error.log crit;
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
