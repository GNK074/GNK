name: Validate
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m pytest ../tests -q
        env:
          PYTHONPATH: .

  service-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: for script in deploy/*.sh service/*.sh infrastructure/docker/*.sh; do bash -n "$script"; done
      - run: python -m unittest discover -s tests/unit -p test_service_script.py -v

  postgres-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gnk
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: gnk_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gnk -d gnk_test" --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/integration/test_postgres_rls.py -q
        env:
          PYTHONPATH: backend
          GNK_TEST_POSTGRES_URL: postgresql://gnk:ci-test-only@localhost:5432/gnk_test
