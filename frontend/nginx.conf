log_format gnk_frontend_safe '$remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log gnk_frontend_safe;
    error_log /var/log/nginx/error.log crit;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ /index.html; }
}
