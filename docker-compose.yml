services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gnk
      POSTGRES_USER: gnk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnk"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      DISCLOSURE_VERSION: ${DISCLOSURE_VERSION:-2026-11-02.1}
      DISCLOSURE_MAX_AGE_HOURS: ${DISCLOSURE_MAX_AGE_HOURS:-24}
      CONTACT_CHANNELS_VERIFIED: ${CONTACT_CHANNELS_VERIFIED:-false}
      COMPANY_REGISTRATION_VERIFIED: ${COMPANY_REGISTRATION_VERIFIED:-false}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_SEBI_REGISTRATION: ${COMPANY_SEBI_REGISTRATION:-}
      COMPANY_BASL_APPLICABLE: ${COMPANY_BASL_APPLICABLE:-false}
      COMPANY_BASL_MEMBERSHIP: ${COMPANY_BASL_MEMBERSHIP:-}
      COMPANY_OFFICE_ADDRESS_VERIFIED: ${COMPANY_OFFICE_ADDRESS_VERIFIED:-false}
      COMPANY_OFFICE_ADDRESS: ${COMPANY_OFFICE_ADDRESS:-}
      DATABASE_URL: postgresql+psycopg://gnk:${POSTGRES_PASSWORD:-}@postgres:5432/gnk
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
